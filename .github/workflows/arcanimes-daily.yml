name: ArcanimesDaFé - Automação Diária

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  gerar-conteudo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install anthropic edge-tts python-dotenv

      - name: Validar configuração da API
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ ERRO: ANTHROPIC_API_KEY não está configurada!"
            echo "Configure em: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY detectada"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Executar pipeline ArcanimesDaFé
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python arcanimes_pipeline.py

      - name: Verificar arquivos gerados
        run: |
          echo "📁 Verificando estrutura de diretórios..."
          ls -la ROTEIROS_PRONTOS/ || echo "⚠️  Nenhum roteiro encontrado"
          ls -la AUDIOS_PRONTOS/ || echo "⚠️  Nenhum áudio encontrado"
          ls -la LEGENDAS_PRONTAS/ || echo "⚠️  Nenhuma legenda encontrada"
          ls -la PROMPTS_CREATY/ || echo "⚠️  Nenhum prompt encontrado"
          ls -la DADOS_PUBLICACAO/ || echo "⚠️  Nenhum dado de publicação encontrado"
          test -f historico_temas.json && echo "✅ historico_temas.json presente" || echo "⚠️  historico_temas.json não encontrado"

      - name: Commit e push dos arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ROTEIROS_PRONTOS/ AUDIOS_PRONTOS/ LEGENDAS_PRONTAS/ PROMPTS_CREATY/ DADOS_PUBLICACAO/ historico_temas.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: conteúdo gerado pelo pipeline ArcanimesDaFé"
          git push origin main

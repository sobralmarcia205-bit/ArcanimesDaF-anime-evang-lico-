name: ArcanimesDaFé - Automação Diária

on:
  schedule:
    # 5 postagens a cada 5 horas
    - cron: '0 0 * * *'   # 00:00 AM UTC
    - cron: '0 5 * * *'   # 05:00 AM UTC
    - cron: '0 10 * * *'  # 10:00 AM UTC
    - cron: '0 15 * * *'  # 03:00 PM UTC
    - cron: '0 20 * * *'  # 08:00 PM UTC
  workflow_dispatch:

jobs:
  gerar-conteudo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install anthropic edge-tts python-dotenv

      - name: Executar pipeline ArcanimesDaFé
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python arcanimes_pipeline.py

      - name: Fazer commit dos arquivos gerados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ROTEIROS_PRONTOS/ AUDIOS_PRONTOS/ LEGENDAS_PRONTAS/ PROMPTS_CREATY/ DADOS_PUBLICACAO/ historico_temas.json
          git commit -m "Conteúdo gerado automaticamente - $(date '+%Y-%m-%d %H:%M:%S')" || echo "Nenhuma mudança"
          git push

      - name: Sucesso ✅
        if: success()
        run: echo "Conteúdo gerado com sucesso!"
